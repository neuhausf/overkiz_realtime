set_known_position:
  name: Set known position
  description: >-
    Sets the calculated position without sending a movement command. Useful
    after the cover has been moved by hand or with a radio remote and the
    calculation needs to be put straight again.
  target:
    entity:
      integration: overkiz_realtime
      domain: cover
  fields:
    position:
      name: Position
      description: Actual position of the cover (0 = closed, 100 = open).
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
    tilt_position:
      name: Tilt position
      description: Actual tilt position, if tilt calculation is enabled.
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"

set_travel_times:
  name: Set travel times
  description: >-
    Overrides the travel times at runtime and stores them permanently. Each
    value covers one complete run from 0 % to 100 %.
  target:
    entity:
      integration: overkiz_realtime
      domain: cover
  fields:
    travel_time_up:
      name: Travel time up
      description: Seconds for a full opening run.
      required: false
      selector:
        number:
          min: 0.5
          max: 600
          step: 0.1
          mode: box
          unit_of_measurement: s
    travel_time_down:
      name: Travel time down
      description: Seconds for a full closing run.
      required: false
      selector:
        number:
          min: 0.5
          max: 600
          step: 0.1
          mode: box
          unit_of_measurement: s
    tilt_time_up:
      name: Tilt time open
      description: Seconds until the slats are fully open.
      required: false
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.1
          mode: box
          unit_of_measurement: s
    tilt_time_down:
      name: Tilt time closed
      description: Seconds until the slats are fully closed.
      required: false
      selector:
        number:
          min: 0.1
          max: 60
          step: 0.1
          mode: box
          unit_of_measurement: s

calibrate:
  name: Calibration run
  description: >-
    Runs the cover end to end and measures the actual travel times from the
    gateway's feedback. Requires the source entity to report a position.
  target:
    entity:
      integration: overkiz_realtime
      domain: cover
  fields:
    direction:
      name: Direction
      description: Which travel time to measure.
      required: false
      default: both
      selector:
        select:
          options:
            - label: Both directions
              value: both
            - label: Opening run only
              value: up
            - label: Closing run only
              value: down
